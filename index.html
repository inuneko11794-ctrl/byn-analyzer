<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNYサイト3つ寄れば文殊超え</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 pb-20">
    <div class="max-w-4xl mx-auto space-y-4">
        
        <!-- ヘッダー -->
        <header class="mb-6 text-center">
            <h1 class="text-2xl font-black text-gray-800 tracking-tight">BNYサイト3つ寄れば文殊超え</h1>
            <p class="text-xs text-gray-500 mt-1">競輪データ管理・分析ダッシュボード</p>
        </header>

        <!-- ① 万車ノート (Grok) -->
        <details class="bg-white rounded-lg shadow-sm border group">
          <summary class="font-bold p-3 cursor-pointer bg-blue-50 text-blue-800 flex justify-between items-center hover:bg-blue-100 transition-colors">
            <span class="flex items-center gap-2">🌐 万車ノート (Grok)</span>
            <span class="text-blue-400 group-open:rotate-180 transition-transform">▼</span>
          </summary>
          <div class="p-2 border-t">
            <iframe src="https://brook-beam-sunny-arch.grok.me" class="w-full h-[500px] border rounded"></iframe>
          </div>
        </details>

        <!-- ② 競輪予想屋さん (Coze AI) -->
        <details class="bg-white rounded-lg shadow-sm border group">
          <summary class="font-bold p-3 cursor-pointer bg-teal-50 text-teal-800 flex justify-between items-center hover:bg-teal-100 transition-colors">
            <span class="flex items-center gap-2">🤖 競輪予想屋さん (専用AI)</span>
            <span class="text-teal-400 group-open:rotate-180 transition-transform">▼</span>
          </summary>
          <div class="p-2 border-t">
            <iframe src="https://www.coze.com/store/agent/7700716983747198981?bot_id=true" class="w-full h-[500px] border rounded"></iframe>
            <p class="text-xs text-gray-500 mt-2 text-center">※バックアップ保存したJSONデータをAIに投げて、「現在のデータ傾向を教えて」と質問できます。</p>
          </div>
        </details>

        <!-- ③ 万車券的中時の1着車番分析 -->
        <details class="bg-white rounded-lg shadow-sm border group">
          <summary class="font-bold p-3 cursor-pointer bg-purple-50 text-purple-800 flex justify-between items-center hover:bg-purple-100 transition-colors">
            <span class="flex items-center gap-2">🎯 万車券的中時の「1着車番」分析（B・Y・N軍）</span>
            <span class="text-purple-400 group-open:rotate-180 transition-transform">▼</span>
          </summary>
          <div class="p-4 border-t">
            <div class="flex flex-col gap-3 mb-4">
              <button id="btnManshaCalc" class="bg-purple-600 text-white px-4 py-3 rounded-lg hover:bg-purple-700 w-full text-sm font-bold shadow transition-colors flex justify-center items-center gap-2">
                📊 現在ツールに入っているデータで計算する
              </button>
              <div class="border-2 border-dashed border-purple-300 rounded-lg p-3 text-center bg-purple-50/50">
                <label class="block text-sm font-bold text-purple-800 mb-2">📁 過去のバックアップ(JSON)を読込</label>
                <input type="file" id="manshaFileInput" accept=".json,application/json" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-bold file:bg-purple-100 file:text-purple-700 hover:file:bg-purple-200 cursor-pointer" />
              </div>
            </div>
            <div id="manshaCarResult" class="text-sm text-gray-700 space-y-4">
              <p class="text-gray-400 text-center py-4 bg-gray-50 rounded border border-dashed">ボタンを押すか、ファイルを選ぶと結果が表示されます</p>
            </div>
          </div>
        </details>
        <!-- ④ 着順・払戻 スクショ読込 ＆ 手動登録 -->
        <details class="bg-white rounded-lg shadow-sm border group" open>
          <summary class="font-bold p-3 cursor-pointer bg-orange-50 text-orange-800 flex justify-between items-center hover:bg-orange-100 transition-colors">
            <span class="flex items-center gap-2">📸 スクショ読込 ＆ ✍️ データ登録</span>
            <span class="text-orange-400 group-open:rotate-180 transition-transform">▼</span>
          </summary>
          <div class="p-4 border-t bg-white">
            <!-- スクショ機能プレースホルダー -->
            <div class="mb-4 p-3 border border-orange-200 bg-orange-50 rounded-lg text-center">
              <p class="text-xs text-orange-800 font-bold mb-2">📸 画像解析（準備中）</p>
              <input type="file" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:bg-orange-200 file:text-orange-800 cursor-pointer mb-2">
              <p class="text-[10px] text-gray-500">※現在は手動入力をご利用ください</p>
            </div>

            <!-- 入力フォーム -->
            <div class="grid grid-cols-2 gap-3 mb-4">
              <div><label class="block text-xs font-bold text-gray-600 mb-1">レースR</label><input type="number" id="inputRaceNo" class="w-full border rounded p-2 text-sm" placeholder="例: 1"></div>
              <div><label class="block text-xs font-bold text-gray-600 mb-1">3連単 着順</label><input type="text" id="inputOrder" class="w-full border rounded p-2 text-sm" placeholder="例: 7-2-5"></div>
              <div><label class="block text-xs font-bold text-gray-600 mb-1">2車単 配当</label><input type="number" id="inputPayout2" class="w-full border rounded p-2 text-sm" placeholder="例: 310"></div>
              <div><label class="block text-xs font-bold text-gray-600 mb-1">3連単 配当</label><input type="number" id="inputPayout3" class="w-full border rounded p-2 text-sm" placeholder="例: 2460"></div>
              
              <div><label class="block text-xs font-bold text-gray-600 mb-1">車立て</label>
                <select id="inputRacers" class="w-full border rounded p-2 text-sm"><option value="7">7車</option><option value="9">9車</option></select>
              </div>
              <div><label class="block text-xs font-bold text-gray-600 mb-1">戦型</label>
                <select id="inputBattle" class="w-full border rounded p-2 text-sm"><option value="2分戦">2分戦</option><option value="3分戦">3分戦</option><option value="4分戦">4分戦</option><option value="単騎戦">単騎戦</option></select>
              </div>
              
              <div><label class="block text-xs font-bold text-gray-600 mb-1">決まり手1</label>
                <select id="inputTech1" class="w-full border rounded p-2 text-sm"><option value="逃">逃</option><option value="捲">捲</option><option value="差">差</option></select>
              </div>
              <div><label class="block text-xs font-bold text-gray-600 mb-1">決まり手2</label>
                <select id="inputTech2" class="w-full border rounded p-2 text-sm"><option value="逃">逃</option><option value="捲">捲</option><option value="差">差</option><option value="マ">マ</option></select>
              </div>
            </div>

            <!-- サイト別判定 -->
            <div class="bg-gray-50 p-3 rounded border mb-4">
              <p class="text-xs font-bold text-gray-700 mb-2 text-center">🏆 サイト別 的中判定</p>
              <div class="flex justify-between gap-2">
                <label class="flex-1 flex flex-col items-center p-2 bg-white border rounded cursor-pointer hover:bg-gray-100"><span class="font-bold text-sm mb-1">B軍</span><input type="checkbox" id="hitB" class="w-5 h-5 accent-orange-500"></label>
                <label class="flex-1 flex flex-col items-center p-2 bg-white border rounded cursor-pointer hover:bg-gray-100"><span class="font-bold text-sm mb-1">Y軍</span><input type="checkbox" id="hitY" class="w-5 h-5 accent-orange-500"></label>
                <label class="flex-1 flex flex-col items-center p-2 bg-white border rounded cursor-pointer hover:bg-gray-100"><span class="font-bold text-sm mb-1">N軍</span><input type="checkbox" id="hitN" class="w-5 h-5 accent-orange-500"></label>
              </div>
            </div>
            
            <button id="btnSaveData" class="w-full bg-gray-800 text-white font-bold py-3 rounded-lg shadow hover:bg-black transition-colors">➕ このレースデータを保存</button>
          </div>
        </details>

        <!-- ⑤ 保存データ一覧＆バックアップ -->
        <details class="bg-white rounded-lg shadow-sm border group">
          <summary class="font-bold p-3 cursor-pointer bg-gray-50 text-gray-800 flex justify-between items-center hover:bg-gray-100 transition-colors">
            <span class="flex items-center gap-2">📁 保存済みデータ一覧 ＆ バックアップ</span>
            <span class="text-gray-400 group-open:rotate-180 transition-transform">▼</span>
          </summary>
          <div class="p-4 border-t">
            <div class="flex justify-between items-center mb-3">
              <span class="text-sm font-bold bg-gray-200 px-2 py-1 rounded">登録数: <span id="dataCount">0</span>件</span>
              <div class="flex gap-2">
                <button id="btnDownloadJson" class="bg-blue-500 text-white text-xs font-bold px-3 py-2 rounded shadow hover:bg-blue-600">📥 JSON保存</button>
                <button id="btnClearData" class="bg-red-500 text-white text-xs font-bold px-3 py-2 rounded shadow hover:bg-red-600">🗑 全消去</button>
              </div>
            </div>
            <div class="overflow-x-auto border rounded-lg max-h-[300px] overflow-y-auto">
              <table class="w-full text-xs text-left whitespace-nowrap">
                <thead class="bg-gray-100 sticky top-0">
                  <tr><th class="p-2">R</th><th class="p-2">着順</th><th class="p-2">3連単</th><th class="p-2 text-center">B</th><th class="p-2 text-center">Y</th><th class="p-2 text-center">N</th></tr>
                </thead>
                <tbody id="dataTableBody" class="divide-y bg-white">
                  <!-- データがここに入ります -->
                </tbody>
              </table>
            </div>
          </div>
        </details>
    </div><!-- container end -->

    <!-- ここからJavaScriptが始まります -->
    <script>
    /* =========================================
       1. 基本データ管理（登録・表示・JSON保存）
       ========================================= */
    const STORAGE_KEY = 'byn3_data';
    let raceData = [];

    // 画面ロード時にデータを読み込む
    document.addEventListener("DOMContentLoaded", () => {
        loadData();
        setupEventListeners();
    });

    function loadData() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try { raceData = JSON.parse(stored); } catch (e) { raceData = []; }
        }
        renderTable();
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(raceData));
        renderTable();
    }

    // フォームからデータを追加
    function handleSaveRace() {
        const raceNo = document.getElementById("inputRaceNo").value;
        const order = document.getElementById("inputOrder").value;
        const payout3 = document.getElementById("inputPayout3").value;
        if (!raceNo || !order) {
            alert("レースRと着順は入力してください！");
            return;
        }

        const newRace = {
            id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
            raceNo: Number(raceNo),
            order: order,
            payout2: Number(document.getElementById("inputPayout2").value) || 0,
            payout3: Number(payout3) || 0,
            racers: document.getElementById("inputRacers").value,
            battle: document.getElementById("inputBattle").value,
            winLine: "", // 必要に応じてフォーム拡張
            linePos: "", 
            tech1: document.getElementById("inputTech1").value,
            tech2: document.getElementById("inputTech2").value,
            sites: {
                B: { bet: document.getElementById("hitB").checked, hit: document.getElementById("hitB").checked },
                Y: { bet: document.getElementById("hitY").checked, hit: document.getElementById("hitY").checked },
                N: { bet: document.getElementById("hitN").checked, hit: document.getElementById("hitN").checked }
            }
        };

        raceData.unshift(newRace); // 先頭に追加
        saveData();
        
        // フォームをリセット
        document.getElementById("inputRaceNo").value = "";
        document.getElementById("inputOrder").value = "";
        document.getElementById("inputPayout2").value = "";
        document.getElementById("inputPayout3").value = "";
        document.getElementById("hitB").checked = false;
        document.getElementById("hitY").checked = false;
        document.getElementById("hitN").checked = false;
        
        alert("レースデータを保存しました！");
    }

    // テーブルを描画
    function renderTable() {
        const tbody = document.getElementById("dataTableBody");
        const countSpan = document.getElementById("dataCount");
        if(!tbody || !countSpan) return;

        countSpan.textContent = raceData.length;
        tbody.innerHTML = "";

        raceData.forEach(race => {
            const tr = document.createElement("tr");
            const hitB = race.sites?.B?.hit ? '🎯' : '❌';
            const hitY = race.sites?.Y?.hit ? '🎯' : '❌';
            const hitN = race.sites?.N?.hit ? '🎯' : '❌';
            
            tr.innerHTML = `
                <td class="p-2">${race.raceNo}R</td>
                <td class="p-2 font-bold">${race.order || '-'}</td>
                <td class="p-2 text-right">${(race.payout3 || 0).toLocaleString()}円</td>
                <td class="p-2 text-center text-lg">${hitB}</td>
                <td class="p-2 text-center text-lg">${hitY}</td>
                <td class="p-2 text-center text-lg">${hitN}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // JSONダウンロード
    function downloadJSON() {
        if (raceData.length === 0) { alert("保存するデータがありません。"); return; }
        const jsonStr = JSON.stringify(raceData, null, 2);
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const dateStr = new Date().toISOString().split('T')[0];
        a.href = url;
        a.download = `byn3_backup_${dateStr}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function clearAllData() {
        if(confirm("本当にすべてのデータを消去しますか？（消去前にJSON保存をおすすめします）")) {
            raceData = [];
            saveData();
        }
    }

    function setupEventListeners() {
        document.getElementById("btnSaveData")?.addEventListener("click", handleSaveRace);
        document.getElementById("btnDownloadJson")?.addEventListener("click", downloadJSON);
        document.getElementById("btnClearData")?.addEventListener("click", clearAllData);
        
        // 1着車番分析のイベントリスナー
        document.getElementById("manshaFileInput")?.addEventListener("change", handleManshaFileUpload);
        document.getElementById("btnManshaCalc")?.addEventListener("click", () => analyzeManshaFirstCar(null));
    }
    /* =========================================
       2. 万車券的中時の1着車番分析（スマホ・完全対応版）
       ========================================= */

    function normalizeManshaData(source) {
      if (Array.isArray(source)) {
        return source.flat(Infinity).filter(item => item && typeof item === "object" && !Array.isArray(item));
      }
      if (!source || typeof source !== "object") return [];
      
      const possibleKeys = ["races", "data", "records", "raceData", "savedData", "byn3_data"];
      for (const key of possibleKeys) {
        if (source[key] !== undefined) {
          const result = normalizeManshaData(source[key]);
          if (result.length > 0) return result;
        }
      }
      if (source.order !== undefined || source.payout3 !== undefined || source.pay3 !== undefined) return [source];
      
      return Object.values(source).filter(item => item && typeof item === "object" && !Array.isArray(item) &&
        (item.order !== undefined || item.payout3 !== undefined || item.pay3 !== undefined)
      );
    }

    function getManshaPayout(race) {
      const raw = race.payout3 ?? race.pay3 ?? race.payout ?? 0;
      const digits = String(raw).replace(/[^0-9]/g, "");
      return Number(digits) || 0;
    }

    function isManshaHit(siteData) {
      if (!siteData || typeof siteData !== "object") return false;
      const hit = siteData.hit;
      return hit === true || hit === 1 || hit === "1" || String(hit).toLowerCase() === "true";
    }

    function escapeManshaHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[char]);
    }

    function analyzeManshaFirstCar(customData = null) {
      const result = document.getElementById("manshaCarResult");
      if (!result) return;

      let source = customData !== null ? customData : raceData;
      const data = normalizeManshaData(source);

      if (data.length === 0) {
        result.innerHTML = "<div class='p-4 rounded border border-red-200 bg-red-50 text-red-600 font-bold text-center'>レースデータが見つかりません。</div>";
        return;
      }

      const sites = ["B", "Y", "N"];
      const stats = { B: { total: 0, cars: {} }, Y: { total: 0, cars: {} }, N: { total: 0, cars: {} } };
      let manshaCount = 0, validOrderCount = 0, missingSiteCount = 0;

      data.forEach(race => {
        if (getManshaPayout(race) < 10000) return;
        manshaCount++;

        const match = String(race.order ?? race.result ?? race.winCar ?? "").trim().match(/^\s*(\d+)/);
        if (!match) return;

        const firstCar = match[1];
        validOrderCount++;

        sites.forEach(site => {
          const siteData = race.sites?.[site];
          if (!siteData) { missingSiteCount++; return; }
          if (isManshaHit(siteData)) {
            stats[site].total++;
            stats[site].cars[firstCar] = (stats[site].cars[firstCar] || 0) + 1;
          }
        });
      });

      let html = `
        <div class="mb-4 p-3 rounded border border-purple-200 bg-purple-50 text-center text-gray-800">
          <p class="font-bold mb-1">📊 分析結果</p>
          <div class="flex justify-center gap-4 text-xs">
            <p>読込: <strong>${data.length}件</strong></p>
            <p>万車: <strong class="text-purple-700">${manshaCount}件</strong></p>
            <p>取得: <strong>${validOrderCount}件</strong></p>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      `;

      sites.forEach(site => {
        const s = stats[site];
        html += `<div class="bg-white p-3 rounded border-2 border-purple-200 shadow-sm"><h4 class="font-bold text-lg border-b-2 border-purple-100 pb-1 mb-2 text-purple-900">${site}軍</h4><p class="text-xs text-gray-600 mb-3">万車的中：<strong>${s.total}回</strong></p>`;
        
        if (s.total === 0) {
            html += `<p class="text-gray-400 text-center py-2 text-xs">的中データなし</p></div>`;
            return;
        }

        const sorted = Object.keys(s.cars).sort((a, b) => s.cars[b] - s.cars[a] || Number(a) - Number(b));
        html += `<ul class="space-y-2">`;
        sorted.forEach(car => {
          const pct = (s.cars[car] / s.total * 100).toFixed(1);
          html += `<li>
            <div class="flex items-center justify-between mb-1 text-sm">
              <span class="font-black text-gray-800">${escapeManshaHTML(car)}番</span>
              <span class="font-bold text-gray-700">${pct}% <span class="font-normal text-xs text-gray-500">(${s.cars[car]}回)</span></span>
            </div>
            <div class="w-full h-3 bg-gray-100 rounded-full overflow-hidden"><div class="bg-purple-600 h-full transition-all" style="width:${pct}%"></div></div>
          </li>`;
        });
        html += `</ul></div>`;
      });
      html += `</div>`;
      if (missingSiteCount > 0) html += `<p class="mt-3 text-[10px] text-gray-400 text-center">※サイト情報欠損：${missingSiteCount}件</p>`;
      
      result.innerHTML = html;
    }

    function handleManshaFileUpload(event) {
      const file = event.target.files?.[0];
      const result = document.getElementById("manshaCarResult");
      if (!file) return;
      result.innerHTML = "<p class='text-center py-3 text-sm'>JSONを読み込んでいます...</p>";
      
      const reader = new FileReader();
      reader.onload = e => {
        try { analyzeManshaFirstCar(JSON.parse(e.target.result)); } 
        catch (err) { result.innerHTML = "<p class='text-red-500 font-bold text-center'>JSON解析エラーです</p>"; }
      };
      reader.readAsText(file, "UTF-8");
    }
    </script>
</body>
</html>
