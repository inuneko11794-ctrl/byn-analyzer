<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYN3サイト寄れば文殊超え</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  /* 折りたたみの矢印を隠す */
  details > summary { list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
</style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-2 md:p-4 max-w-6xl mx-auto space-y-4">
<div id="loading" class="hidden fixed inset-0 bg-black/75 text-white flex flex-col justify-center items-center z-50 font-bold"><div>爆速ピクセル解析中...</div></div>

<h1 class="text-xl font-bold text-center text-blue-700">🚴‍♂️ BYN3サイト寄れば文殊超え</h1>

<!-- 1. 取り込み -->
<details class="bg-white rounded shadow group" open>
  <summary class="font-bold border-b p-4 cursor-pointer flex justify-between items-center hover:bg-gray-50 transition-colors">
    <div class="flex items-center gap-2"><span>➕ スクショ取り込み (爆速解析)</span><span class="text-gray-400 group-open:rotate-180 transition-transform inline-block">▼</span></div>
  </summary>
  <div class="p-4 pt-2">
    <label class="block border-2 border-blue-300 border-dashed p-8 text-center cursor-pointer rounded bg-gray-50 hover:bg-blue-50 transition-colors"
         ondragover="event.preventDefault(); this.classList.add('bg-blue-100');"
         ondragleave="event.preventDefault(); this.classList.remove('bg-blue-100');"
         ondrop="event.preventDefault(); this.classList.remove('bg-blue-100'); window.handleImageUpload({target: {files: event.dataTransfer.files}});">
      📸 スクショ画像を選択、またはここにドロップ (複数可)
      <input type="file" id="fileUp" accept="image/*" multiple class="hidden" onchange="window.handleImageUpload(event)">
    </label>
  </div>
</details>

<!-- 2. 手動追加 -->
<details class="bg-white rounded shadow group">
  <summary class="font-bold border-b p-4 cursor-pointer flex justify-between items-center hover:bg-gray-50 transition-colors">
    <div class="flex items-center gap-2"><span>✍️ 手動追加</span><span class="text-gray-400 group-open:rotate-180 transition-transform inline-block">▼</span></div>
  </summary>
  <div class="p-4 pt-2">
    <div class="grid grid-cols-2 md:grid-cols-5 gap-2">
      <input id="mOrd" placeholder="着順(7-1-2)" class="border p-2 rounded">
      <input type="number" id="mP2" placeholder="2連単(円)" class="border p-2 rounded">
      <input type="number" id="mP3" placeholder="3連単(円)" class="border p-2 rounded">
      <select id="mRac" class="border p-2 rounded"><option value="7">7車</option><option value="9">9車</option><option value="8">8車</option><option value="6">6車</option><option value="5">5車</option></select>
      <input id="mWinLine" type="text" placeholder="1着ライン入力" class="border p-2 rounded bg-yellow-50">
      <button onclick="window.addManual()" class="bg-blue-500 text-white p-2 rounded col-span-2 md:col-span-5">直接追加</button>
    </div>
  </div>
</details>

<!-- 3. プレビュー -->
<details class="bg-white rounded shadow group" open>
  <summary class="font-bold border-b p-4 cursor-pointer flex justify-between items-center hover:bg-gray-50 transition-colors">
    <div class="flex items-center gap-2"><span>📝 プレビュー (<span id="stgCnt">0</span>件)</span><span class="text-gray-400 group-open:rotate-180 transition-transform inline-block">▼</span></div>
    <button id="applyBtn" onclick="event.stopPropagation(); window.applyStg()" class="bg-green-500 text-white px-3 py-1 rounded opacity-50 cursor-not-allowed" disabled>保存する</button>
  </summary>
  <div class="p-4 pt-2 overflow-x-auto">
    <table class="w-full min-w-[850px] text-center border-collapse text-sm"><thead><tr class="bg-gray-100"><th>R</th><th>着順</th><th>2連単</th><th>3連単</th><th>車立</th><th>1着ライン</th><th>B(予/的)</th><th>Y(予/的)</th><th>N(予/的)</th><th>予想ライン</th><th>操作</th></tr></thead><tbody id="stgBody"></tbody></table>
  </div>
</details>

<!-- 4. ダッシュボード -->
<details class="bg-white rounded shadow group" open>
  <summary class="font-bold border-b p-4 cursor-pointer flex justify-between items-center hover:bg-gray-50 transition-colors">
    <div class="flex items-center gap-2"><span>📊 究極分析ダッシュボード</span><span class="text-gray-400 group-open:rotate-180 transition-transform inline-block">▼</span></div>
  </summary>
  <div class="p-4 pt-2 space-y-4">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-center">
      <div class="bg-gray-50 p-2 rounded border"><div class="text-xs text-gray-500">保存済</div><div id="dTot" class="text-lg font-bold text-blue-600">0</div></div>
      <div class="bg-green-50 p-2 rounded border border-green-200"><div class="text-xs text-gray-500">B的軍</div><div id="dBHit" class="font-bold text-green-700">0%</div><div id="dBMansha" class="text-xs text-green-600">万車:0</div></div>
      <div class="bg-orange-50 p-2 rounded border border-orange-200"><div class="text-xs text-gray-500">Y的軍</div><div id="dYHit" class="font-bold text-orange-600">0%</div><div id="dYMansha" class="text-xs text-orange-500">万車:0</div></div>
      <div class="bg-red-50 p-2 rounded border border-red-200"><div class="text-xs text-gray-500">N的軍</div><div id="dNHit" class="font-bold text-red-600">0%</div><div id="dNMansha" class="text-xs text-red-500">万車:0</div></div>
    </div>

    <!-- NEW: 万車時1着車番グラフ -->
    <div class="bg-red-50 p-3 rounded border border-red-200 space-y-2">
      <div class="flex items-center gap-2">
        <span class="font-bold text-red-800 text-sm whitespace-nowrap">🔥 万車時(3連単1万円以上)の1着車番:</span>
      </div>
      <div class="w-full overflow-hidden" style="height:140px;"><canvas id="manshaC"></canvas></div>
    </div>

    <div class="bg-gray-50 p-3 rounded border">
      <div class="flex justify-between mb-2 text-sm font-bold"><span class="text-gray-700">📈 合計値分布＆配当</span><label class="bg-white px-2 border rounded"><input type="radio" name="dType" value="sum2" checked onchange="window.updateDash()">2連単</label><label class="bg-white px-2 border rounded"><input type="radio" name="dType" value="sum3" onchange="window.updateDash()">3連単</label></div>
      <div class="grid md:grid-cols-2 gap-2"><div style="height:200px"><canvas id="distC"></canvas></div><div style="height:200px"><canvas id="payC"></canvas></div></div>
    </div>

    <div class="bg-indigo-50 p-3 rounded border border-indigo-100 space-y-2">
      <div class="flex items-center gap-2">
        <span class="font-bold text-indigo-800 text-sm whitespace-nowrap">3着傾向:</span>
        <select id="trendSel" onchange="window.updateTrend()" class="border p-1 text-sm bg-white rounded font-bold w-full"><option value="">2車単を選択してください</option></select>
      </div>
      <div class="w-full overflow-hidden" style="height:160px;"><canvas id="trendC"></canvas></div>
    </div>

    <div class="overflow-x-auto"><table class="w-full min-w-[500px] text-center border-collapse text-xs"><thead><tr class="bg-gray-100"><th class="border p-1">被り状況</th><th class="border p-1">件数</th><th class="border p-1">3連単平均</th><th class="border p-1">2連単平均</th></tr></thead><tbody id="dashTbody"></tbody></table></div>
    <div style="height:200px"><canvas id="anaC"></canvas></div>
  </div>
</details>

<!-- 5. 保存済み一覧 -->
<details class="bg-white rounded shadow group mb-10" open>
  <summary class="font-bold border-b p-4 cursor-pointer flex justify-between items-center hover:bg-gray-50 transition-colors">
    <div class="flex items-center gap-2"><span>📂 保存済み一覧</span><span class="text-gray-400 group-open:rotate-180 transition-transform inline-block">▼</span></div>
    <div class="flex gap-2">
      <button onclick="event.stopPropagation(); window.exportJson()" class="bg-gray-600 text-white px-2 py-1 rounded text-xs">バックアップ</button>
      <input type="file" id="impFile" class="hidden" onchange="window.importJson(event)" accept=".json">
      <button onclick="event.stopPropagation(); document.getElementById('impFile').click()" class="bg-gray-600 text-white px-2 py-1 rounded text-xs">復元</button>
      <button onclick="event.stopPropagation(); window.clearAll()" class="bg-red-500 text-white px-2 py-1 rounded text-xs">全消去</button>
    </div>
  </summary>
  <div class="p-4 pt-2 overflow-x-auto">
    <table class="w-full min-w-[850px] text-center border-collapse text-sm"><thead><tr class="bg-gray-100"><th>着順</th><th>2連単</th><th>3連単</th><th>車立</th><th>1着ライン</th><th>B(予/的)</th><th>Y(予/的)</th><th>N(予/的)</th><th>予想ライン</th><th>操作</th></tr></thead><tbody id="savedBody"></tbody></table>
  </div>
</details>
