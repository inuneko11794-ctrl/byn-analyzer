<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>万車ノート - KEIRIN LEDGER</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f5f2eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="万車ノート">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Tesseract.js (OCR機能) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f5f2eb] text-[#2c2a29] min-h-screen pb-24 font-sans antialiased selection:bg-[#2c2a29] selection:text-white">

  <!-- ヘッダー -->
  <header class="bg-[#f5f2eb] border-b border-[#e5dfd3] sticky top-0 z-30 px-5 py-4">
    <div class="max-w-2xl mx-auto flex justify-between items-start">
      <div>
        <p class="text-[10px] tracking-widest text-[#8c857b] font-bold uppercase">KEIRIN LEDGER</p>
        <h1 class="text-2xl font-black tracking-tight text-[#2c2a29]">万車ノート</h1>
      </div>
      <div class="text-right">
        <span class="text-[11px] text-[#8c857b] block font-bold">万車 0/0 0万円以上</span>
        <button type="button" onclick="loadSampleData()" class="text-xs text-[#2c2a29] underline hover:opacity-70 font-semibold mt-0.5">
          サンプル挿入
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6 space-y-6">

    <!-- タイトル説明 -->
    <div class="space-y-1">
      <h2 class="text-xl font-bold text-[#2c2a29]">画面を貼る</h2>
      <p class="text-xs text-[#6e675e] leading-relaxed">
        着順と払戻を貼ると、選んだ日付に開催を足す。同じ日が何回あっても、そのまま積む。
      </p>
    </div>

    <!-- 日付 ＆ 開催日タグ -->
    <div class="space-y-3 bg-[#ede7dc]/60 p-4 rounded-2xl border border-[#e2d9ca]">
      <div>
        <label class="block text-xs font-bold text-[#6e675e] mb-1">日付</label>
        <input type="date" id="targetDate" class="w-full bg-white border border-[#d8cfc0] rounded-xl px-3 py-2 text-sm text-[#2c2a29] font-bold shadow-sm focus:outline-none focus:border-[#2c2a29]">
      </div>

      <div>
        <label class="block text-xs font-bold text-[#6e675e] mb-1">何日目</label>
        <div class="flex flex-wrap gap-1.5" id="dayPicker">
          <button type="button" onclick="selectDay(this, '初日')" class="day-btn px-3 py-1.5 rounded-full text-xs font-bold bg-[#2c2a29] text-white transition">初日</button>
          <button type="button" onclick="selectDay(this, '2日目')" class="day-btn px-3 py-1.5 rounded-full text-xs font-bold bg-white text-[#6e675e] border border-[#d8cfc0] hover:bg-[#e8e2d5] transition">2日目</button>
          <button type="button" onclick="selectDay(this, '3日目')" class="day-btn px-3 py-1.5 rounded-full text-xs font-bold bg-white text-[#6e675e] border border-[#d8cfc0] hover:bg-[#e8e2d5] transition">3日目</button>
          <button type="button" onclick="selectDay(this, '4日目')" class="day-btn px-3 py-1.5 rounded-full text-xs font-bold bg-white text-[#6e675e] border border-[#d8cfc0] hover:bg-[#e8e2d5] transition">4日目</button>
          <button type="button" onclick="selectDay(this, '5日目')" class="day-btn px-3 py-1.5 rounded-full text-xs font-bold bg-white text-[#6e675e] border border-[#d8cfc0] hover:bg-[#e8e2d5] transition">5日目</button>
          <button type="button" onclick="selectDay(this, '最終日')" class="day-btn px-3 py-1.5 rounded-full text-xs font-bold bg-white text-[#6e675e] border border-[#d8cfc0] hover:bg-[#e8e2d5] transition">最終日</button>
        </div>
      </div>
    </div>

    <!-- 🌟 万車ノート風 1つのドロップ・貼り付けエリア -->
    <div class="space-y-3">
      <div id="dropZone" onclick="document.getElementById('multiFileInput').click()" class="border-2 border-dashed border-[#c8beae] hover:border-[#2c2a29] rounded-2xl p-8 text-center cursor-pointer bg-[#ece5d8]/70 transition-all flex flex-col items-center justify-center min-h-[160px] shadow-sm relative overflow-hidden group">
        <input type="file" id="multiFileInput" accept="image/*" multiple class="hidden" onchange="handleMultipleImages(event)">
        
        <!-- 通常待機画面 -->
        <div id="dropIdleState" class="space-y-2">
          <p class="text-base font-black text-[#2c2a29] group-hover:scale-105 transition-transform">ここに貼る</p>
          <p class="text-xs text-[#7c756a] font-medium">1枚目が着順、2枚目が払戻。逆でも大丈夫。</p>
        </div>

        <!-- 読み込み中アニメーション -->
        <div id="dropLoadingState" class="hidden flex-col items-center justify-center space-y-2">
          <i class="fa-solid fa-spinner fa-spin text-2xl text-[#2c2a29]"></i>
          <p class="text-sm font-bold text-[#2c2a29]">読んでいます...</p>
          <p class="text-xs text-[#7c756a]">1枚目が着順、2枚目が払戻。逆でも大丈夫。</p>
        </div>
      </div>

      <!-- 解析結果バッジ（例：着順 11  払戻 11） -->
      <div id="badgeStatusArea" class="hidden flex flex-wrap items-center gap-2 pt-1">
        <span id="badgeArrival" class="bg-[#1f3a32] text-white text-xs font-bold px-3 py-1 rounded-md shadow-sm">着順 0</span>
        <span id="badgePayout" class="bg-[#1f3a32] text-white text-xs font-bold px-3 py-1 rounded-md shadow-sm">払戻 0</span>
        <span id="statusMessageText" class="text-xs font-bold text-[#5c554a] ms-1"></span>
      </div>

      <!-- 解析結果レースカードリスト（動画同様のデザイン） -->
      <div id="raceCardList" class="space-y-2.5 pt-1"></div>

      <!-- 「この内容を足す」ボタン -->
      <button type="button" id="submitBtn" onclick="applyAndSaveRaces()" disabled class="w-full bg-[#1c2e28] hover:bg-[#12201b] disabled:opacity-40 disabled:cursor-not-allowed text-white font-black text-sm py-3.5 rounded-xl shadow-md transition-all">
        この内容を足す
      </button>
    </div>

    <!-- 📊 統合成績カード & 履歴一覧 -->
    <div class="pt-6 border-t border-[#e2d9ca] space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-[#2c2a29] text-base">📋 記録一覧</h3>
        <button type="button" onclick="clearAllData()" class="text-xs text-rose-700 hover:underline font-semibold">全データ削除</button>
      </div>

      <div id="savedHistoryList" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
        <!-- JS挿入 -->
      </div>
    </div>

  </main>

  <!-- ボトムナビゲーション (動画再現) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-[#242220] border-t border-[#383532] text-[#8c857b] px-6 py-2.5 z-40">
    <div class="max-w-md mx-auto flex justify-between items-center text-center">
      <button class="flex flex-col items-center gap-1 text-xs hover:text-white transition">
        <i class="fa-solid fa-graduation-cap text-base"></i>
        <span class="text-[10px]">学習</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-xs hover:text-white transition">
        <i class="fa-solid fa-square-poll-vertical text-base"></i>
        <span class="text-[10px]">結果</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-xs text-white font-bold">
        <i class="fa-solid fa-pen-to-square text-base"></i>
        <span class="text-[10px]">記録</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-xs hover:text-white transition">
        <i class="fa-solid fa-bullseye text-base"></i>
        <span class="text-[10px]">焦点</span>
      </button>
    </div>
  </nav>

  <script src="app.js"></script>
</body>
</html>
